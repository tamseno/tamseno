<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">tamseno — Ezra Tam</title>
  <desc id="desc">A quiet dark canvas with a luminous T monogram, fine orbital rings and restrained cyan and violet accents. Decorative rings rotate slowly; reduced-motion preferences disable animation.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0c1320"/><stop offset=".55" stop-color="#090e19"/><stop offset="1" stop-color="#101326"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#306e90" stop-opacity=".23"/><stop offset=".54" stop-color="#314b89" stop-opacity=".1"/><stop offset="1" stop-color="#080e19" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fcff"/><stop offset=".55" stop-color="#dfeefa"/><stop offset="1" stop-color="#a5b8d2"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbffff"/><stop offset=".35" stop-color="#8cecf1"/><stop offset=".7" stop-color="#738ce9"/><stop offset="1" stop-color="#b4a5e9"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6bdde8"/><stop offset=".4" stop-color="#304b68"/><stop offset="1" stop-color="#9285c7"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83dfe6" stop-opacity=".03"/><stop offset=".35" stop-color="#b5f3f5" stop-opacity=".7"/><stop offset=".75" stop-color="#9994e1" stop-opacity=".32"/><stop offset="1" stop-color="#9994e1" stop-opacity=".03"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#6fdbdf" stop-opacity=".65"/><stop offset=".45" stop-color="#424965" stop-opacity=".6"/><stop offset="1" stop-color="#8090bc" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#668299" opacity=".35"/></pattern>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <style>
    .label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
    .orbit-a { animation: turn 90s linear infinite; }
    .orbit-b { animation: turn 110s linear infinite reverse; }
    .light { animation: breathe 8s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .orbit-a, .orbit-b, .light { animation: none; } }
  </style>
