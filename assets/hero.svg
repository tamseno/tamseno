<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4e4e7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e4e4e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4d4d8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#e7e7e9" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="round">
      <rect width="1280" height="420" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)" opacity="0.8"/>
    <rect width="1280" height="420" fill="none" stroke="#0a0a0a" stroke-opacity="0.14" stroke-width="2"/>

    <ellipse cx="1080" cy="60" rx="240" ry="170" fill="url(#blobA)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 36;0 0" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="360" rx="200" ry="150" fill="url(#blobB)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;44 -30;0 0" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="380" rx="190" ry="140" fill="url(#blobA)" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;36 -28;0 0" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- left : identity -->
    <text x="80" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" letter-spacing="5" fill="#0a0a0a">&gt; HELLO WORLD, I&#8217;M</text>
    <text x="76" y="202" font-size="90" font-weight="800" letter-spacing="-2" fill="#0a0a0a">Ezra Tam</text>
    <text x="80" y="250" font-size="27" font-weight="600" fill="#0a0a0a">AI Systems Engineer</text>
    <text x="80" y="286" font-size="19" fill="#525252">LLM safety &#183; coding agents &#183; API infrastructure</text>

    <text x="80" y="326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#737373">$ focus --llm=<tspan fill="#0a0a0a">&#8220;safety &#183; agents &#183; infra&#8221;</tspan></text>
    <rect x="472" y="310" width="10" height="20" fill="#0a0a0a">
      <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.5;0.6;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <!-- stack chips -->
    <g font-size="15" font-weight="600">
      <rect x="80" y="344" width="112" height="36" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="104" cy="362" r="5" fill="#0a0a0a"/>
      <text x="118" y="367" fill="#0a0a0a">Python</text>

      <rect x="204" y="344" width="80" height="36" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="228" cy="362" r="5" fill="#525252"/>
      <text x="242" y="367" fill="#0a0a0a">Go</text>

      <rect x="296" y="344" width="94" height="36" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="320" cy="362" r="5" fill="#737373"/>
      <text x="334" y="367" fill="#0a0a0a">Rust</text>

      <rect x="402" y="344" width="138" height="36" rx="18" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="426" cy="362" r="5" fill="#a3a3a3"/>
      <text x="440" y="367" fill="#0a0a0a">TypeScript</text>

      <rect x="552" y="344" width="150" height="36" rx="18" fill="#0a0a0a"/>
      <circle cx="576" cy="362" r="5" fill="#ffffff"/>
      <text x="590" y="367" fill="#ffffff">Granada, ES</text>
    </g>

    <!-- right : terminal card (inverted) -->
    <g>
      <rect x="840" y="80" width="360" height="264" rx="16" fill="#0a0a0a"/>
      <circle cx="868" cy="106" r="6" fill="#525252"/>
      <circle cx="890" cy="106" r="6" fill="#737373"/>
      <circle cx="912" cy="106" r="6" fill="#a3a3a3"/>
      <text x="932" y="111" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#737373">ezra@granada: ~</text>
      <line x1="840" y1="124" x2="1200" y2="124" stroke="#262626"/>

      <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
        <text x="866" y="160"><tspan fill="#ffffff">&gt;</tspan><tspan fill="#e5e5e5"> whoami</tspan></text>
        <text x="866" y="186"><tspan fill="#a3a3a3">ezra_tam</tspan><tspan fill="#525252"> &#8212; </tspan><tspan fill="#d4d4d4">ai systems engineer</tspan></text>
        <text x="866" y="218"><tspan fill="#ffffff">&gt;</tspan><tspan fill="#e5e5e5"> stack --list</tspan></text>
        <text x="866" y="244"><tspan fill="#fafafa">python</tspan><tspan fill="#525252"> &#183; </tspan><tspan fill="#d4d4d4">go</tspan><tspan fill="#525252"> &#183; </tspan><tspan fill="#a3a3a3">rust</tspan><tspan fill="#525252"> &#183; </tspan><tspan fill="#e5e5e5">typescript</tspan></text>
        <text x="866" y="276"><tspan fill="#ffffff">&gt;</tspan><tspan fill="#e5e5e5"> mission</tspan></text>
        <text x="866" y="302" fill="#d4d4d4">make llms safer &amp; more useful</text>
      </g>
      <rect x="866" y="314" width="10" height="18" fill="#ffffff">
        <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.5;0.6;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="80" y="396" width="1120" height="2" fill="url(#line)" opacity="0.85"/>
  </g>
</svg>
