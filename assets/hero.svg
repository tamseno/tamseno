<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ezra Tam — AI Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="55%" stop-color="#0b0b0f"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="860" y1="0" x2="860" y2="340"/>
    <line x1="940" y1="0" x2="940" y2="340"/>
    <line x1="1020" y1="0" x2="1020" y2="340"/>
    <line x1="1100" y1="0" x2="1100" y2="340"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- accent rings, right side -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.35">
    <circle cx="1010" cy="170" r="110" stroke-width="1.5"/>
    <circle cx="1010" cy="170" r="78" stroke-width="1"/>
    <circle cx="1010" cy="170" r="46" stroke-width="1"/>
  </g>
  <circle cx="1010" cy="170" r="6" fill="#f59e0b"/>

  <!-- content -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="58" width="56" height="5" rx="2.5" fill="url(#bar)"/>
    <text x="72" y="132" font-size="76" font-weight="800" letter-spacing="1" fill="#ffffff">EZRA TAM</text>
    <text x="74" y="176" font-size="26" font-weight="600" letter-spacing="4" fill="#f59e0b">AI SYSTEMS ENGINEER</text>
    <text x="74" y="220" font-size="22" fill="#a1a1aa">I build AI systems that ship — safety harnesses, gateways, agents.</text>
    <text x="74" y="268" font-size="17" fill="#71717a">Granada, Spain · Rust &amp; TypeScript · LLM Safety</text>
  </g>
</svg>
